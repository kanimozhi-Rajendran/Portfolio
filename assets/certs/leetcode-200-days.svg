<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e1e" />
      <stop offset="50%" stop-color="#2d2215" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFA116" />
      <stop offset="100%" stop-color="#FF8000" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 161, 22, 0.35)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#lcBg)" stroke="rgba(255, 161, 22, 0.3)" stroke-width="2" />
  <circle cx="200" cy="180" r="130" fill="url(#goldGlow)" />

  <!-- Badge Shield Outer -->
  <polygon points="200,60 290,110 290,220 200,285 110,220 110,110" fill="#181818" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />
  <polygon points="200,75 275,118 275,212 200,268 125,212 125,118" fill="rgba(255, 161, 22, 0.08)" stroke="rgba(255, 215, 0, 0.3)" stroke-width="1.5" />

  <!-- Flame / Trophy Icon -->
  <path d="M 200 105 C 208 125, 225 135, 220 155 C 216 170, 202 175, 200 190 C 198 175, 184 170, 180 155 C 175 135, 192 125, 200 105 Z" fill="url(#goldGrad)" />
  
  <!-- "200" Number -->
  <text x="200" y="215" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="1">200</text>
  <text x="200" y="235" text-anchor="middle" fill="#FFA116" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2">DAYS</text>
  <text x="200" y="252" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">2026</text>

  <!-- Title Bottom -->
  <text x="200" y="325" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="17" font-weight="700">LeetCode Consistency</text>
  <text x="200" y="350" text-anchor="middle" fill="#FFA116" font-family="'Inter', sans-serif" font-size="13" font-weight="600">DSA &amp; Problem Solving</text>
</svg>
