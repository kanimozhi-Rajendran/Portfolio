<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="50%" stop-color="#1b263b" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>
    <radialGradient id="secGlow" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#secBg)" />
  <circle cx="680" cy="100" r="280" fill="url(#secGlow)" />

  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Borders -->
  <rect x="25" y="25" width="750" height="400" rx="16" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" />
  <rect x="35" y="35" width="730" height="380" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Header -->
  <g transform="translate(60, 65)">
    <rect width="255" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <g transform="translate(18, 11)" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="14" x2="0" y2="4" />
      <line x1="4" y1="14" x2="4" y2="8" />
      <line x1="8" y1="14" x2="8" y2="1" />
      <line x1="12" y1="14" x2="12" y2="8" />
      <line x1="16" y1="14" x2="16" y2="4" />
    </g>
    <text x="44" y="23" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" letter-spacing="1">CISCO NETACAD</text>
  </g>

  <g transform="translate(550, 65)">
    <rect width="190" height="36" rx="18" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="95" y="23" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">CYBERSECURITY</text>
  </g>

  <!-- Title -->
  <g transform="translate(60, 160)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">COURSE COMPLETION CERTIFICATE</text>
    <text x="0" y="44" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="30" font-weight="800">Introduction to Cybersecurity</text>
    <text x="0" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15">Threat Defense, Cryptography Fundamentals, Network &amp; Data Protection</text>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 275)">
    <rect width="170" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="85" y="22" text-anchor="middle" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SECURITY BASICS</text>
  </g>

  <g transform="translate(60, 360)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="13">Verified Academic Credential • Cisco Networking Academy</text>
  </g>

  <!-- Right Visual: Shield & Lock Symbol -->
  <g transform="translate(630, 260)">
    <circle cx="0" cy="0" r="70" fill="rgba(56, 189, 248, 0.06)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
    <!-- Shield -->
    <path d="M 0 -38 L 28 -24 C 28 14, 0 38, 0 38 C 0 38, -28 14, -28 -24 Z" fill="rgba(2, 132, 199, 0.3)" stroke="url(#shieldGrad)" stroke-width="2.5" />
    <!-- Keyhole / Lock in Center -->
    <circle cx="0" cy="-6" r="6" fill="#38bdf8" />
    <path d="M -3 -6 L 3 -6 L 5 10 L -5 10 Z" fill="#38bdf8" />
  </g>
</svg>
