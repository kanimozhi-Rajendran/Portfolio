<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lcBg50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191528" />
      <stop offset="50%" stop-color="#241938" />
      <stop offset="100%" stop-color="#0f0c1a" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.35)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#lcBg50)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="2" />
  <circle cx="200" cy="180" r="130" fill="url(#purpleGlow)" />

  <!-- Badge Shield Outer -->
  <polygon points="200,60 290,110 290,220 200,285 110,220 110,110" fill="#111827" stroke="url(#purpleGrad)" stroke-width="4" stroke-linejoin="round" />
  <polygon points="200,75 275,118 275,212 200,268 125,212 125,118" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" />

  <!-- Flame Icon -->
  <path d="M 200 105 C 208 125, 225 135, 220 155 C 216 170, 202 175, 200 190 C 198 175, 184 170, 180 155 C 175 135, 192 125, 200 105 Z" fill="url(#purpleGrad)" />
  
  <!-- "50" Number -->
  <text x="200" y="215" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="1">50</text>
  <text x="200" y="235" text-anchor="middle" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2">DAYS</text>
  <text x="200" y="252" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">2026</text>

  <!-- Title Bottom -->
  <text x="200" y="325" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="17" font-weight="700">LeetCode 50 Days</text>
  <text x="200" y="350" text-anchor="middle" fill="#c084fc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Active DSA Momentum</text>
</svg>
