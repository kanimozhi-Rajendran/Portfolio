<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001e2b" />
      <stop offset="60%" stop-color="#023430" />
      <stop offset="100%" stop-color="#00684a" />
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 237, 100, 0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ED64" />
      <stop offset="100%" stop-color="#00684A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)" />
  <circle cx="680" cy="90" r="280" fill="url(#glow1)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="750" height="400" rx="16" fill="none" stroke="rgba(0, 237, 100, 0.3)" stroke-width="2" />
  <rect x="35" y="35" width="730" height="380" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Header Badge -->
  <g transform="translate(60, 65)">
    <rect width="170" height="34" rx="17" fill="rgba(0, 237, 100, 0.15)" stroke="rgba(0, 237, 100, 0.4)" stroke-width="1" />
    <!-- MongoDB Leaf Icon -->
    <path d="M 22 25 C 22 25, 20 17, 26 10 C 27 8, 28 8, 29 10 C 35 17, 33 25, 33 25 C 33 25, 30 26, 27.5 24.5 Z" fill="url(#leafGrad)" />
    <path d="M 27.5 24.5 L 27.5 28.5" stroke="#00ED64" stroke-width="1.5" />
    <text x="44" y="22" fill="#00ED64" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1">MONGODB</text>
  </g>

  <!-- Skill Badge Pill -->
  <g transform="translate(600, 65)">
    <rect width="140" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="70" y="22" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SKILL BADGE</text>
  </g>

  <!-- Center Decorative AI Agent Graphics -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="75" fill="rgba(0, 237, 100, 0.06)" stroke="rgba(0, 237, 100, 0.25)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="52" fill="rgba(2, 52, 48, 0.6)" stroke="rgba(0, 237, 100, 0.4)" stroke-width="1" />
    <!-- Brain / Robot / Agent Icon -->
    <path d="M -22 -10 C -22 -22, -10 -30, 0 -30 C 10 -30, 22 -22, 22 -10 C 26 -8, 28 -2, 26 5 C 24 12, 18 16, 12 18 L 12 22 L -12 22 L -12 18 C -18 16, -24 12, -26 5 C -28 -2, -26 -8, -22 -10 Z" fill="none" stroke="#00ED64" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="-7" cy="-5" r="3" fill="#00ED64" />
    <circle cx="7" cy="-5" r="3" fill="#00ED64" />
    <line x1="-6" y1="10" x2="6" y2="10" stroke="#00ED64" stroke-width="2" stroke-linecap="round" />
    <!-- Nodes -->
    <circle cx="-60" cy="-35" r="6" fill="#00ED64" opacity="0.8" />
    <circle cx="60" cy="35" r="5" fill="#00ED64" opacity="0.7" />
    <circle cx="-50" cy="50" r="4" fill="#00ED64" opacity="0.6" />
    <line x1="-54" y1="-31" x2="-22" y2="-15" stroke="rgba(0,237,100,0.3)" stroke-dasharray="3,3" />
    <line x1="55" y1="31" x2="22" y2="15" stroke="rgba(0,237,100,0.3)" stroke-dasharray="3,3" />
  </g>

  <!-- Title & Description -->
  <text x="60" y="185" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    Building AI Agents
  </text>
  <text x="60" y="225" fill="#00ED64" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    with MongoDB
  </text>

  <text x="60" y="275" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
    Autonomous Reasoning • Vector Search • Function Calling • Tool Integration
  </text>

  <!-- Bottom Verification Bar -->
  <line x1="60" y1="330" x2="740" y2="330" stroke="rgba(255,255,255,0.08)" />
  <text x="60" y="370" fill="#64748b" font-family="'Inter', sans-serif" font-size="13">
    ISSUING ORGANIZATION: <tspan fill="#e2e8f0" font-weight="600">MongoDB</tspan>
  </text>
  <text x="60" y="392" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">
    Official Skill Badge Verification
  </text>
</svg>
