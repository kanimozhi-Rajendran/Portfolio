<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#141c38" />
      <stop offset="100%" stop-color="#2a0d24" />
    </linearGradient>
    <radialGradient id="glow5" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad5)" />
  <circle cx="670" cy="110" r="270" fill="url(#glow5)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="750" height="400" rx="16" fill="none" stroke="rgba(244, 63, 94, 0.35)" stroke-width="2" />
  <rect x="35" y="35" width="730" height="380" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Header Badge -->
  <g transform="translate(60, 65)">
    <rect width="250" height="34" rx="17" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
    <!-- Shield Icon -->
    <path d="M 22 10 L 32 14 L 32 22 C 32 27, 22 30, 22 30 C 22 30, 12 27, 12 22 L 12 14 Z" fill="url(#shieldGrad)" />
    <text x="40" y="22" fill="#f43f5e" font-family="'Outfit', 'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8">TECH MAHINDRA FOUNDATION</text>
  </g>

  <!-- Skill India Digital Pill -->
  <g transform="translate(560, 65)">
    <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="90" y="22" text-anchor="middle" fill="#fda4af" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">SKILL INDIA DIGITAL</text>
  </g>

  <!-- Center Decorative Shield Graphic -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="75" fill="rgba(244, 63, 94, 0.06)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="52" fill="rgba(42, 13, 36, 0.6)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
    <!-- Large Security Shield + Keyhole -->
    <path d="M 0 -28 L 26 -18 L 26 2 C 26 18, 0 30, 0 30 C 0 30, -26 18, -26 2 L -26 -18 Z" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="0" cy="-4" r="5" fill="#f43f5e" />
    <polygon points="-3,-2 3,-2 4,10 -4,10" fill="#f43f5e" />
  </g>

  <!-- Title & Description -->
  <text x="60" y="175" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    Cybersecurity
  </text>
  <text x="60" y="215" fill="#f43f5e" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    Skilling Course
  </text>

  <text x="60" y="270" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
    Network Defense • Threat Assessment • Vulnerability Management • Data Security
  </text>

  <!-- Bottom Verification Bar -->
  <line x1="60" y1="330" x2="740" y2="330" stroke="rgba(255,255,255,0.08)" />
  <text x="60" y="370" fill="#64748b" font-family="'Inter', sans-serif" font-size="13">
    ISSUING ORGANIZATION: <tspan fill="#e2e8f0" font-weight="600">Tech Mahindra Foundation (via Skill India Digital Hub)</tspan>
  </text>
  <text x="60" y="392" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">
    Verified Technical Certification
  </text>
</svg>
