<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="lcBg100" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e28" />
      <stop offset="50%" stop-color="#1b2838" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.35)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#lcBg100)" stroke="rgba(14, 165, 233, 0.3)" stroke-width="2" />
  <circle cx="200" cy="180" r="130" fill="url(#cyanGlow)" />

  <!-- Badge Shield Outer -->
  <polygon points="200,60 290,110 290,220 200,285 110,220 110,110" fill="#111827" stroke="url(#cyanGrad)" stroke-width="4" stroke-linejoin="round" />
  <polygon points="200,75 275,118 275,212 200,268 125,212 125,118" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Flame Icon -->
  <path d="M 200 105 C 208 125, 225 135, 220 155 C 216 170, 202 175, 200 190 C 198 175, 184 170, 180 155 C 175 135, 192 125, 200 105 Z" fill="url(#cyanGrad)" />
  
  <!-- "100" Number -->
  <text x="200" y="215" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="1">100</text>
  <text x="200" y="235" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="800" letter-spacing="2">DAYS</text>
  <text x="200" y="252" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">2026</text>

  <!-- Title Bottom -->
  <text x="200" y="325" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-size="17" font-weight="700">LeetCode 100 Days</text>
  <text x="200" y="350" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Consistent Problem Solving</text>
</svg>
