<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001e2b" />
      <stop offset="50%" stop-color="#092f38" />
      <stop offset="100%" stop-color="#00684a" />
    </linearGradient>
    <radialGradient id="glow2" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 237, 100, 0.22)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ED64" />
      <stop offset="100%" stop-color="#00684A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />
  <circle cx="670" cy="110" r="270" fill="url(#glow2)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="25" y="25" width="750" height="400" rx="16" fill="none" stroke="rgba(0, 237, 100, 0.3)" stroke-width="2" />
  <rect x="35" y="35" width="730" height="380" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Header Badge -->
  <g transform="translate(60, 65)">
    <rect width="170" height="34" rx="17" fill="rgba(0, 237, 100, 0.15)" stroke="rgba(0, 237, 100, 0.4)" stroke-width="1" />
    <path d="M 22 25 C 22 25, 20 17, 26 10 C 27 8, 28 8, 29 10 C 35 17, 33 25, 33 25 C 33 25, 30 26, 27.5 24.5 Z" fill="url(#leafGrad2)" />
    <path d="M 27.5 24.5 L 27.5 28.5" stroke="#00ED64" stroke-width="1.5" />
    <text x="44" y="22" fill="#00ED64" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1">MONGODB</text>
  </g>

  <!-- Skill Badge Pill -->
  <g transform="translate(600, 65)">
    <rect width="140" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="70" y="22" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SKILL BADGE</text>
  </g>

  <!-- Center Decorative RAG / Vector Graphics -->
  <g transform="translate(600, 250)">
    <circle cx="0" cy="0" r="75" fill="rgba(0, 237, 100, 0.06)" stroke="rgba(0, 237, 100, 0.25)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="52" fill="rgba(9, 47, 56, 0.6)" stroke="rgba(0, 237, 100, 0.4)" stroke-width="1" />
    <!-- Vector Database / Layers Icon -->
    <ellipse cx="0" cy="-14" rx="26" ry="10" fill="none" stroke="#00ED64" stroke-width="2.2" />
    <path d="M -26 -14 L -26 0 C -26 6, 0 10, 0 10 C 0 10, 26 6, 26 0 L 26 -14" fill="none" stroke="#00ED64" stroke-width="2.2" />
    <path d="M -26 0 L -26 14 C -26 20, 0 24, 0 24 C 0 24, 26 20, 26 14 L 26 0" fill="none" stroke="#00ED64" stroke-width="2.2" />
    <circle cx="0" cy="-14" r="3" fill="#00ED64" />
    <!-- Retrieval arrows -->
    <path d="M -50 -10 Q -38 -26 -20 -20" stroke="#00ED64" stroke-width="1.8" stroke-dasharray="2,2" fill="none" />
    <path d="M 50 -10 Q 38 -26 20 -20" stroke="#00ED64" stroke-width="1.8" stroke-dasharray="2,2" fill="none" />
  </g>

  <!-- Title & Description -->
  <text x="60" y="185" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    Building RAG Apps
  </text>
  <text x="60" y="225" fill="#00ED64" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">
    Using MongoDB
  </text>

  <text x="60" y="275" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15" font-weight="400">
    Atlas Vector Search • Semantic Retrieval • LLM Context Augmentation
  </text>

  <!-- Bottom Verification Bar -->
  <line x1="60" y1="330" x2="740" y2="330" stroke="rgba(255,255,255,0.08)" />
  <text x="60" y="370" fill="#64748b" font-family="'Inter', sans-serif" font-size="13">
    ISSUING ORGANIZATION: <tspan fill="#e2e8f0" font-weight="600">MongoDB</tspan>
  </text>
  <text x="60" y="392" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">
    Official Skill Badge Verification
  </text>
</svg>
