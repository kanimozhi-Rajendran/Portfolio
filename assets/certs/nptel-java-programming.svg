<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nptelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b192c" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.25)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="eliteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#nptelBg)" />
  <circle cx="700" cy="100" r="280" fill="url(#goldGlow)" />

  <!-- Subtle Geometric Lattice -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Border & Seal Frame -->
  <rect x="25" y="25" width="750" height="400" rx="16" fill="none" stroke="rgba(234, 179, 8, 0.35)" stroke-width="2" />
  <rect x="35" y="35" width="730" height="380" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Header: NPTEL & SWAYAM Brand -->
  <g transform="translate(60, 65)">
    <rect width="210" height="36" rx="18" fill="rgba(234, 179, 8, 0.12)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
    <circle cx="20" cy="18" r="8" fill="#eab308" />
    <text x="36" y="23" fill="#fef08a" font-family="'Outfit', 'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1">NPTEL × SWAYAM</text>
  </g>

  <g transform="translate(560, 65)">
    <rect width="180" height="36" rx="18" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="90" y="23" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">IIT KHARAGPUR</text>
  </g>

  <!-- Course Title & Subtitle -->
  <g transform="translate(60, 160)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="2">NATIONAL PROGRAMME ON TECHNOLOGY ENHANCED LEARNING</text>
    <text x="0" y="44" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="800">Programming in Java</text>
    <text x="0" y="74" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="16" font-weight="500">Elite Certificate of Excellence &amp; Mastery</text>
  </g>

  <!-- Elite Gold Badge Pill -->
  <g transform="translate(60, 270)">
    <rect width="360" height="42" rx="21" fill="url(#eliteGrad)" stroke="#fde047" stroke-width="1.5" />
    <!-- Star Icon -->
    <path d="M 24 21 L 27.5 28 L 35 29 L 29.5 34.5 L 31 42 L 24 38 L 17 42 L 18.5 34.5 L 13 29 L 20.5 28 Z" transform="translate(4, -10) scale(0.6)" fill="#ffffff" />
    <text x="38" y="26" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">ELITE — 77% SCORE | TOP CANDIDATE</text>
  </g>

  <!-- Roll No & Verification Footnote -->
  <g transform="translate(60, 350)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', monospace" font-size="12" font-weight="500">Roll No: <tspan fill="#e2e8f0" font-weight="600">NPTEL26CS36S863800119</tspan></text>
    <text x="0" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Certified among 19,306 candidates across India</text>
  </g>

  <!-- Right Side: Official Elite Gold Seal Artwork -->
  <g transform="translate(640, 275)">
    <!-- Outer Starburst Rays -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="rgba(234, 179, 8, 0.3)" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="62" fill="rgba(234, 179, 8, 0.08)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="48" fill="#1e1b18" stroke="#ca8a04" stroke-width="1.5" />
    
    <!-- Ribbons Hanging Down -->
    <path d="M -18 42 L -26 80 L -12 72 L 0 80 L -8 42 Z" fill="#ca8a04" />
    <path d="M 18 42 L 8 80 L 0 72 L -12 80 L -4 42 Z" fill="#eab308" opacity="0.9" />

    <!-- Center Trophy Icon -->
    <path d="M -14 -12 L 14 -12 L 11 8 C 10 16, -10 16, -11 8 Z" fill="url(#goldGrad)" />
    <path d="M -14 -8 C -22 -8, -20 2, -12 4" fill="none" stroke="#fef08a" stroke-width="2" />
    <path d="M 14 -8 C 22 -8, 20 2, 12 4" fill="none" stroke="#fef08a" stroke-width="2" />
    <rect x="-3" y="12" width="6" height="8" fill="#ca8a04" />
    <rect x="-10" y="20" width="20" height="4" rx="2" fill="#eab308" />

    <text x="0" y="-22" text-anchor="middle" fill="#fef08a" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" letter-spacing="1.5">ELITE</text>
  </g>
</svg>
