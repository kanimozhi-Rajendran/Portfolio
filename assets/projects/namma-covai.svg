  <!-- Secondary App Frame (Detail view) -->
  <g transform="translate(420, 85)">
    <rect width="160" height="310" rx="20" fill="#170c1d" stroke="rgba(244,63,94,0.2)" stroke-width="1.5"/>
    <rect x="50" y="8" width="60" height="12" rx="6" fill="#0d0411"/>
    
    <rect x="15" y="35" width="130" height="85" rx="10" fill="#381640"/>
    <text x="80" y="82" fill="#ffffff" font-size="24" text-anchor="middle">🏔️</text>
    <text x="20" y="140" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold">Adiyogi & Isha Yoga</text>
    <text x="20" y="155" fill="#f43f5e" font-size="9" font-family="sans-serif">Top Iconic Landmark</text>
    <text x="20" y="175" fill="#94a3b8" font-size="8" font-family="sans-serif">112-ft iconic statue, cultural</text>
    <text x="20" y="188" fill="#94a3b8" font-size="8" font-family="sans-serif">events and serene mountain view.</text>
    
    <rect x="20" y="210" width="120" height="28" rx="8" fill="#f43f5e"/>
    <text x="80" y="228" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Get Directions</text>
