    <rect x="35" y="195" width="135" height="35" rx="6" fill="#24102b"/>
    <text x="45" y="214" fill="#ffffff" font-size="10" font-family="sans-serif">Acme Corp ($12k)</text>
    <rect x="35" y="238" width="135" height="35" rx="6" fill="#24102b"/>
    <text x="45" y="257" fill="#ffffff" font-size="10" font-family="sans-serif">Nexus AI Cloud ($8k)</text>
    
    <rect x="195" y="155" width="155" height="155" rx="10" fill="#14091a" stroke="rgba(255,255,255,0.05)"/>
