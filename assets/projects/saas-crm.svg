      <stop offset="0%" stop-color="#190918" />
      <stop offset="50%" stop-color="#241026" />
      <stop offset="100%" stop-color="#0f0514" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="700" cy="90" r="170" fill="#f43f5e" opacity="0.08"/>
  <circle cx="100" cy="360" r="140" fill="#a855f7" opacity="0.06"/>
  
  <!-- CRM Dashboard Mockup -->
  <g transform="translate(130, 60)">
