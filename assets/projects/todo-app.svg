<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b18" />
      <stop offset="50%" stop-color="#241026" />
      <stop offset="100%" stop-color="#0e0413" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="700" cy="110" r="160" fill="#f43f5e" opacity="0.08"/>
  
  <g transform="translate(180, 60)">
    <rect width="440" height="330" rx="16" fill="#1c0e22" stroke="rgba(244,63,94,0.3)" stroke-width="1.5"/>
    <rect width="440" height="45" rx="16" fill="#281335"/>
    <circle cx="25" cy="22" r="6" fill="#f43f5e"/>
    <circle cx="45" cy="22" r="6" fill="#fb7185" opacity="0.6"/>
    <circle cx="65" cy="22" r="6" fill="#f472b6" opacity="0.6"/>
    <text x="220" y="28" fill="#f1f5f9" font-size="13" font-family="'Outfit', sans-serif" font-weight="600" text-anchor="middle">Todo Application • Responsive Task Tracker</text>
    
    <!-- Input mock -->
    <rect x="30" y="65" width="280" height="38" rx="8" fill="#130819" stroke="rgba(255,255,255,0.1)"/>
    <text x="45" y="88" fill="#64748b" font-size="11" font-family="sans-serif">Add a new daily goal...</text>
    <rect x="320" y="65" width="90" height="38" rx="8" fill="#f43f5e"/>
    <text x="365" y="88" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">+ Add</text>
    
    <!-- Tasks list -->
    <rect x="30" y="120" width="380" height="45" rx="8" fill="#23102b"/>
    <circle cx="50" cy="142" r="8" fill="#10b981"/>
    <text x="50" y="146" fill="#ffffff" font-size="9" text-anchor="middle">✓</text>
    <text x="70" y="146" fill="#94a3b8" font-size="11" font-family="sans-serif" text-decoration="line-through">Complete LeetCode Daily Problem</text>
    
    <rect x="30" y="175" width="380" height="45" rx="8" fill="#23102b"/>
    <circle cx="50" cy="197" r="8" fill="#10b981"/>
    <text x="50" y="201" fill="#ffffff" font-size="9" text-anchor="middle">✓</text>
    <text x="70" y="201" fill="#94a3b8" font-size="11" font-family="sans-serif" text-decoration="line-through">Review Python Pandas DataFrame Operations</text>
    
    <rect x="30" y="230" width="380" height="45" rx="8" fill="#23102b" stroke="rgba(244,63,94,0.3)"/>
    <circle cx="50" cy="252" r="8" fill="#140819" stroke="#f43f5e"/>
    <text x="70" y="256" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="600">Train Random Forest Classifier on Scheme Data</text>
    
    <rect x="30" y="285" width="380" height="45" rx="8" fill="#23102b"/>
    <circle cx="50" cy="307" r="8" fill="#140819" stroke="rgba(255,255,255,0.3)"/>
    <text x="70" y="311" fill="#cbd5e1" font-size="11" font-family="sans-serif">Update Portfolio Project Cards & Demo Videos</text>
  </g>
</svg>
