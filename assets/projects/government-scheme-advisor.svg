<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b18" />
      <stop offset="50%" stop-color="#241026" />
      <stop offset="100%" stop-color="#120516" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="700" cy="80" r="180" fill="#f43f5e" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="380" r="140" fill="#ec4899" opacity="0.06" filter="url(#glow)"/>
  
  <!-- Dashboard Card Mockup -->
  <g transform="translate(150, 70)">
    <rect width="500" height="310" rx="16" fill="#1f1424" stroke="rgba(244,63,94,0.3)" stroke-width="1.5"/>
    <rect width="500" height="45" rx="16" fill="#2d1633"/>
    <circle cx="25" cy="22" r="6" fill="#f43f5e" opacity="0.8"/>
    <circle cx="45" cy="22" r="6" fill="#fb7185" opacity="0.5"/>
    <circle cx="65" cy="22" r="6" fill="#fda4af" opacity="0.5"/>
    <text x="250" y="28" fill="#e2e8f0" font-size="13" font-family="'Outfit', sans-serif" font-weight="600" text-anchor="middle">AI Personalized Government Scheme Advisor</text>
    
    <!-- Inner cards -->
    <rect x="25" y="65" width="215" height="100" rx="10" fill="#160919" stroke="rgba(255,255,255,0.06)"/>
    <text x="40" y="95" fill="#f43f5e" font-size="12" font-family="sans-serif" font-weight="700">ELIGIBILITY SCORE</text>
    <text x="40" y="135" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="700">94.8%</text>
    <rect x="40" y="145" width="180" height="6" rx="3" fill="#331838"/>
    <rect x="40" y="145" width="160" height="6" rx="3" fill="url(#accent)"/>
    
    <rect x="260" y="65" width="215" height="100" rx="10" fill="#160919" stroke="rgba(255,255,255,0.06)"/>
    <text x="275" y="95" fill="#f43f5e" font-size="12" font-family="sans-serif" font-weight="700">RECOMMENDED SCHEMES</text>
    <text x="275" y="135" fill="#ffffff" font-size="28" font-family="sans-serif" font-weight="700">12 Active</text>
    
    <!-- Recommendation rows -->
    <rect x="25" y="180" width="450" height="50" rx="8" fill="#180b1d" stroke="rgba(244,63,94,0.15)"/>
    <circle cx="50" cy="205" r="14" fill="#3b153b"/>
    <text x="50" y="210" fill="#f43f5e" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <text x="80" y="202" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="600">PM Student Scholarship Scheme</text>
    <text x="80" y="218" fill="#94a3b8" font-size="11" font-family="sans-serif">Matched via ML Classifier • 98% Match</text>
    
    <rect x="25" y="240" width="450" height="50" rx="8" fill="#180b1d" stroke="rgba(255,255,255,0.04)"/>
    <circle cx="50" cy="265" r="14" fill="#2d1633"/>
    <text x="50" y="270" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <text x="80" y="262" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="600">Skill Development Innovation Grant</text>
    <text x="80" y="278" fill="#94a3b8" font-size="11" font-family="sans-serif">Eligibility Verified • 92% Match</text>
  </g>
</svg>
